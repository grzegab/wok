task:
  title: "Crawler: dodanie portali NoFluffJobs, Bulldogjob, solid.jobs"
  description: |
    Dodać do crawlera nowe portale z ofertami pracy: NoFluffJobs, Bulldogjob, solid.jobs.
    Zakres:
      1. Źródła (portale) zdefiniowane w bazie danych — dziś URL-e hardcodowane w internal/category/category.go, wyłącznie justjoin.it
      2. Konfigurowalne URL-e list ofert; użytkownik MUSI ręcznie potwierdzić poprawność URL-i przed implementacją (twardy gate)
      3. Zapis surowego HTML oferty oraz — jeśli portal udostępnia — słów kluczowych i daty pojawienia się oferty (posted_at już istnieje)
    Poza zakresem: deduplikacja semantyczna między portalami (użytkownik zrobi ręcznie z LLM).
    Istniejąca deduplikacja po URL (ExistingPossibilityUrls + ON CONFLICT (url) DO UPDATE) ma zostać nietknięta.
    Throttling: oferta co 2-3 min (dziś 5-12s w transformer.go), lista ofert co 4-5h z jitterem (dziś 2h + 1h jitter w fetcher.go).
  status: in_progress
  tags: [crawler, scraping, database, throttling]
  priority: null

