# Connection settings of every service that talks to Postgres.
x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-wok}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wok}
  POSTGRES_DB: ${POSTGRES_DB:-wok}

services:
  redis:
    image: redis:latest
    restart: always

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wok}
      POSTGRES_DB: ${POSTGRES_DB:-wok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wok}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: always
    ports:
      - "80:80"
    environment:
      <<: *postgres-env
      REDIS_ADDR: redis:6379
      WEB_ADDR: ${WEB_ADDR:-:80}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOGIN_USER: ${LOGIN_USER}
      LOGIN_PASS_HASH: ${LOGIN_PASS_HASH}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  crawler:
    build:
      context: .
      dockerfile: docker/crawler/Dockerfile
    restart: always
    # Chromium orphans helper processes (zygote, crashpad) that reparent to
    # PID 1. The Go binary never reaps them, so without an init they pile up
    # as zombies until fork/pthread_create start failing with EAGAIN.
    init: true
    environment: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy

  # One-off jobs, not part of the always-on stack: the tools profile keeps
  # `up` from starting them, `docker compose run` starts one when needed.
  cleaner:
    build:
      context: .
      dockerfile: docker/cleaner/Dockerfile
    profiles: [tools]
    environment: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy

  # One MCP session per run, over the stdin/stdout of `docker compose run -T`,
  # which an MCP client drives through ssh.
  mcp:
    build:
      context: .
      dockerfile: docker/mcp/Dockerfile
    profiles: [tools]
    environment: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
