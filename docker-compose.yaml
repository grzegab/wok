services:
  redis:
    image: redis:latest
    restart: always

  postgres:
    image: postgres:17-alpine
    restart: always
    # Loopback only: bin/wok-mcp runs on the VPS host (driven over ssh by an MCP
    # client) and reaches the database here, without opening it to the network.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wok}
      POSTGRES_DB: ${POSTGRES_DB:-wok}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wok}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: always
    ports:
      - "80:80"
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-wok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wok}
      POSTGRES_DB: ${POSTGRES_DB:-wok}
      WEB_ADDR: ${WEB_ADDR:-:80}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOGIN_USER: ${LOGIN_USER}
      LOGIN_PASS_HASH: ${LOGIN_PASS_HASH}
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  crawler:
    build:
      context: .
      dockerfile: docker/crawler/Dockerfile
    restart: always
    # Chromium orphans helper processes (zygote, crashpad) that reparent to
    # PID 1. The Go binary never reaps them, so without an init they pile up
    # as zombies until fork/pthread_create start failing with EAGAIN.
    init: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-wok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wok}
      POSTGRES_DB: ${POSTGRES_DB:-wok}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
